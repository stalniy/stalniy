name: Publish resume

on:
  push:
    branches: [main]
    paths:
      - resume.yaml
      - jsonresume-theme/**
      - scripts/build-resume.js
      - package.json
      - package-lock.json
      - .github/workflows/publish-resume.yml
  workflow_dispatch:

concurrency:
  group: resume-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
      - run: npm run build:resume
      - run: mkdir -p site && cp resume.html site/index.html && cp resume.html site/resume.html
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resume-site
          path: site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resume-json
          path: resume.json

  cloudflare_pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: read
    environment:
      name: cloudflare-pages
      url: https://sstotskyi.dev
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm ci
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resume-site
          path: site
      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ vars.CLOUDFLARE_ACCOUNT_ID }}
        run: npx --no wrangler pages deploy site --project-name=sstotskyi --branch=main

  gist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resume-json
      - name: Publish JSON resume gist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          RESUME_GIST_ID: ${{ vars.RESUME_GIST_ID }}
        run: | # shell
          set -euo pipefail
          : "${GH_TOKEN:?Set the GIST_TOKEN repository secret with Gists write permission}"
          gist_id="$RESUME_GIST_ID"
          if [[ -z "$gist_id" ]]; then
            echo "Provide RESUME_GIST_ID variable!"
            exit 1;
          fi
          gh gist edit "$gist_id" --filename resume.json resume.json
          echo "Published https://gist.github.com/$gist_id"
