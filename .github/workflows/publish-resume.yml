name: Publish resume

on:
  push:
    branches: [main]
    paths:
      - resume.yaml
      - jsonresume-theme/**
      - scripts/build-resume.js
      - package.json
      - .github/workflows/publish-resume.yml
  workflow_dispatch:

concurrency:
  group: resume-publish
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'
      - run: npm install
      - run: npm run build:resume
      - run: mkdir -p site && cp resume.html site/resume.html
      - uses: actions/upload-pages-artifact@7b1f4a764d45c48632c6b24a0339c27f5614fb0b # v4.0.0
        with:
          path: site
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: resume-json
          path: resume.json

  pages:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/configure-pages@45bfe0192ca1faeb007ade9deae92b16b8254a0d # v6.0.0
      - uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4.0.5
        id: deployment

  gist:
    needs: build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4.3.0
        with:
          name: resume-json
      - name: Publish JSON resume gist
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GIST_TOKEN }}
          RESUME_GIST_ID: ${{ vars.RESUME_GIST_ID }}
        run: | # shell
          set -euo pipefail
          : "${GH_TOKEN:?Set the GIST_TOKEN repository secret with Gists write permission}"
          gist_id="$RESUME_GIST_ID"
          if [[ -z "$gist_id" ]]; then
            echo "Provide RESUME_GIST_ID variable!"
            exit 1;
          fi
          gh gist edit "$gist_id" --filename resume.json resume.json
          echo "Published https://gist.github.com/$gist_id"
