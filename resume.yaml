    highlights:
      - |-
        **Enabled platform administrators, providers, and users to configure cloud IP telephony within their respective roles** by designing the frontend architecture for a white-label SaaS platform.
        Each audience had a dedicated application with its own set of features.
      - |-
        **Enabled administrators to configure interactive voice response (IVR) call flows visually.**
        Independently built the editor's frontend in Knockout.js.
        Administrators could assign actions to keypad choices and rearrange the call flow by dragging actions within a tree.
      - |-
        **Enabled the team to reuse UI components and validation across the platform's role-specific applications** by designing a shared frontend library that each application extended.
        Used Knockout.js to bind views and components, and RequireJS to load modules on demand.
    skills: [JavaScript, Knockout.js, REST, Jasmine, Gitlab CI]

