  summary: |-
    Staff-level software engineer with **18+ years** of experience in software development, including 5 years of building and managing engineering teams of 3–7 people alongside hands-on development.

    I specialize in product and platform engineering, taking ownership from discovery and architecture through implementation, production rollout, and monitoring. My experience spans SaaS, cloud infrastructure, distributed systems, developer tooling, and application security.

    I use **AI agents** daily, developing custom skills, workflows, and deterministic verification mechanisms to accelerate delivery without compromising software quality.

    I've been **contributing to open source** since 2011. In 2017, I created [CASL](https://casl.js.org), a widely adopted TypeScript authorization library with over **11 million monthly downloads**.
    I've authored **100+ technical blog posts** and have a successful track record of independently acquiring clients, providing technical consulting, and delivering software solutions.

work:
  - name: Overclock Labs
    position: Staff full-stack developer
    startDate: "2025-01"
    endDate: "2026-09"
    location: Remote
    description: |-
      [Akash Console](github.com/akash-network/console) is the open-source dashboard developers use to deploy and manage workloads on a decentralised cloud compute marketplace.
    summary: |
      Shared ownership of Akash Console services in a 3 developer team and served as the primary owner of the TypeScript blockchain SDK.
      **Worked directly with customers and stakeholders**, took features from discovery through production rollout using feature flags and monitoring, maintained Kubernetes infrastructure, and participated in on-call support.
    highlights:
      - |-
        **Reduced production error alerts by 75%** by identifying a transaction issue that could leave customers charged without receiving service,
        coordinating the blockchain change with the VP of Engineering, and implementing and deploying unordered transactions in Akash Console.
      - |-
        **Drove discovery, designed the architecture, and implemented a unified TypeScript SDK** for Akash Console and the Akash open-source community.
        Consolidated two overlapping libraries into one SDK with browser and Node.js support, TypeScript types, and lazy loading. Coordinated with 3 open-source projects and designed support for gRPC and gRPC Gateway.
      - |-
        **Designed and shipped encrypted storage for Akash Console deployment secrets**, moving them out of plaintext browser localStorage while preserving public API compatibility.
        Used per-user data encryption keys wrapped by Cloud KMS to limit the impact of a compromised key and allow KMS key rotation without re-encrypting deployment secrets.
        Bound each ciphertext to its owner and record.
      - |-
        **Designed and shipped a backend service that discovered and monitored 2,000+ Akash providers**, keeping their available resources, attributes, and availability up to date in PostgreSQL, in real time.
        Ported the provider's Golang matching logic to TypeScript so Akash Console could identify potential bidders in about 100 ms, before users submitted an on-chain deployment that could take up to 5 seconds.
      - |-
        **Implemented security protection** against supply-chain attacks, code vulnerabilities, and exposed secrets as AI use in development grew by integrating Snyk, Socket, CodeQL, and Secretlint into CI.
      - |-
        **Implemented runtime security controls** in all Node.js microservices by utilizing Node.js permission system. Worked consistently in both dev and prod environments.
      - |-
        **Increased weekly deployments from 16 to 40** and reduced CI wait time by an estimated 2.6 hours per week by replacing Webpack with tsup, Jest with Vitest, and adding GitHub merge queue support.
        Implemented the migration manually on the first app, then used AI to help spread it out over other apps.
      - |-
        **Protected deployment secrets from provider impersonation** by implementing mTLS certificate validation in Akash Console's provider proxy.
        Wrote network-level tests before refactoring the single-file Express service. The proxy verified provider identity against the blockchain and rejected requests when a provider's certificate was missing or invalid.
      - |-
        **Detected and blocked an attempt to reach internal Kubernetes services** through Akash Console’s public provider proxy.
        Identified unusual request patterns while reviewing production alerts, then added URL validation and DNS checks to block requests targeting internal services and IP addresses.
        The requests began returning HTTP 400 and eventually stopped.
      - |-
        **Improved production stability** by migrating 8 microservices to strict TypeScript over several months, including shared packages.
        Started with smaller services and enabled strict checking incrementally in larger applications, catching more errors at build time while feature development continued.
        Production incident rate declined after the migration.
      - |-
        **Restored a customer's access to deployment logs** after reproducing a WebSocket failure triggered by an oversized cookie. Debugged the issue directly with the customer, tested and deployed the fix, and had the customer confirm that logs worked again.
      - |-
        **Diagnosed and fixed intermittent Akash Console API high latency** that pushed response times to 7–10 seconds and sometimes caused Kubernetes to restart containers after health-check timeouts.
        Reproduced the issue locally with API load testing and event-loop delay tracing, then verified that affected requests responded in a few milliseconds in production.
      - |-
        **Reduced the risk of post-deployment failures** caused by differences between the Akash Chain SDK’s Go and TypeScript implementations by adding cross-language compatibility tests that checked TypeScript behavior against expected outputs from the Go test suite.
    skills: [ts-js, React.js, Next.js, REST, gRPC, Protobuf, PostgreSQL, Docker, Kubernetes, GCP, OTEL, GitHub Actions, Grafana, Prometheus, Jest, Vitest, Helm, Playwright]

  - name: Printify Inc.
    location: Remote
    position: Senior front-end developer
    startDate: "2021-10"
    endDate: "2024-12"
    description: |-
      Print on demand SaaS platform to help merchants and print providers find each other and produce prints on different goods.
    summary: |-
      Delivered merchant-facing features for Printify's print-on-demand platform,
      from clarifying business requirements and breaking them down into technical work
      to rolling out changes behind feature flags. Shaped frontend architecture and
      REST API contracts, coordinated changes across squads and application modules,
      and monitored and responded to frontend production incidents.
    highlights:
      - |-
        **Enabled merchants to choose and pay in a supported currency** by leading the frontend rollout of multi-currency support across squads.
        Designed how currency selection was shared across modules and layers.
      - |-
        **Improved page load times and reliability** by migrating legacy Backbone functionality to Angular.
        Reconstructed undocumented behavior from the existing code, added unit tests for the Angular implementations, and rolled out changes behind feature flags while monitoring production.
      - |-
        **Decreased time to delivery for frontend changes** by introducing GitHub’s merge queue for 20+ frontend developers.
        Eliminated the need to update PR branches manually after every change to `main`, helping increase frontend deployments from 10 to 30 per day.
      - |-
        **Decreased time to delivery for frontend releases** by reusing release-versioned Angular assets built in CI.
        This cut the deployment pipeline from about 10 minutes to 1 minute.
      - |-
        **Led 3 internal remote meetups** on building TypeScript backends and estimating engineering work, using examples from my own projects when Printify decided to write several services in Node.js.
    skills: [ts-js, Angular, REST, Cypress, Jest]

  - name: First Asset HR
    location: Remote
    position: Senior backend platform developer
    startDate: "2020-10"
    endDate: "2021-09"
    description: |-
      Internal management system for human resource managers.
    summary: |-
      Designed and built shared backend libraries for an internal HR management system on a three-developer team.
      **Worked directly with the company owner** to clarify requirements and documented architectural decisions for approval.
      Refined the PostgreSQL library's query interface with feedback from the developers who used it to compose dynamic SQL with a tagged template function.
      Documented the libraries, reviewed code, and integrated my results across all applications.
    highlights:
      - |-
        **Provided the backend team a single, type-safe way to access PostgreSQL** by designing and building its data access library.
        The same interface covered ordinary and dynamic columns, stored as JSONB object fields, so adding a field required no database migration.
      - |-
        **Provided cache invalidation across horizontally scaled backend instances**, so an update on one instance told the others to discard stale local data.
        Implemented this with PostgreSQL LISTEN/NOTIFY, reusing the existing database and avoiding the need for a managed Redis cluster.
      - |-
        **Enabled the React app to request GraphQL operations by ID** by building tooling that extracted queries at build time, assigned each one an identifier, and replaced raw queries in client requests with those IDs.
      - |-
        **Standardized release, linting, and formatting configuration across all applications** by building a shared CLI for semantic-release, ESLint, and Prettier and integrating it into every app.
    skills: [ts-js, GraphQL, PostgreSQL, GitHub Actions]

  - name: Infozahyst
    location: Kyiv, Ukraine
    position: Team lead
    startDate: "2018-09"
    endDate: "2020-01"
    description: |-
      CRM-like information analytical data driven system that allows to aggregate and analyze structured, semi-structured and unstructured data.
    summary: |
      Led a seven-person team spanning frontend, backend, QA, and DevOps. Managed hiring, one-on-ones, and performance reviews, led sprint activities, and prioritized technical debt.
      **Reported directly to the CTO**, a project stakeholder, and incorporated his feedback into the frontend and backend architecture for a graph-based analysis system.
      Documented design decisions and built the working Node.js application that served as the reference for the C# backend later.
    highlights:
      - |-
        **Enabled analysts to define object types, model relationships and inheritance, and visually investigate connections between records**.
        Designed and documented the frontend and backend architecture with input from the CTO, and built a working Node.js application that served as the reference implementation for later migration to C#.
      - |-
        **Discussed and agreed with each team member an individual development plan** through one-on-one meetings, assessing their performance, and agreeing together on what they would work on next.
      - |-
        **Established development process: planning, review, testing for each sprint.**
        Led daily standups, introduced sprint planning and retrospectives, configured Jira automation,
         expanded code review from the team lead alone to developers reviewing each other's changes, and established a testing strategy.
      - |-
        **Enabled relationship analysis for a customer using the system as a CRM** by implementing analytics in C# that counted relationships between objects matching specified conditions.
    skills: [ts-js, C#, Vue.js, GraphQL, PostgreSQL, ElasticSearch, RabbitMQ, GitLab CI, Ansible, Jest, TestCafe]

  - name: Namecheap Inc
    location: Lviv, Ukraine
    position: Tech lead
    startDate: "2017-08"
    endDate: "2018-05"
    description: |-
      Hosting company: worked in platform and help desk teams
    summary: |
      Led a three-person internal engineering team that contributed to projects owned by other teams.
      Managed hiring, mentoring, one-on-ones, and performance reviews alongside hands-on development.
      The teams that owned the projects retained decision-making authority.
    highlights:
      - |-
        **Built a lightweight website deployment system for the marketing team** using Contentful, terraform and AWS lambda functions.
      - |-
        **Cut Node.js end-to-end test runtime from several minutes to several seconds** by moving database migrations from before every test to suite startup.
        Used disposable factories so each test managed its own db records.
    skills: [ts-js, Vue.js, REST, MySQL, Docker, Terraform, Microservices, AWS, Jenkins]

  - name: Ciklum (outstaff)
    location: Kyiv, Ukraine
    position: Tech lead
    startDate: "2016-01"
    endDate: "2017-07"
    description: |-
      SaaS platform helping distributed retailers plan and execute their activities.
    summary: |
      Led a five-person engineering team building a SaaS platform for distributed retailers.
      Managed hiring, mentoring, one-on-ones, and performance reviews alongside hands-on feature development.
      **Worked directly with the customer** to plan and clarify requirements.
      Guided framework evaluation through prototypes, designed and documented the architecture for the web and hybrid mobile apps, and managed technical debt in the legacy Backbone client.
    highlights:
      - |-
        **Eliminated the customer's OrientDB Enterprise support cost** and removed the need to keep access-control data in sync across two databases
        by reimplementing access control in MongoDB using query conditions and denormalization.
      - |-
        **Gave the Backbone legacy client a clearer structure** by introducing Rivets components and adapting the existing application to use them.
      - |-
        **Enabled code reuse across the web and hybrid mobile app** by designing an Angular 2 and Ionic 2 architecture with a shared service layer and shared UI components.
        I chose that approach after the team prototyped alternatives against its web, iOS, and Android requirements.
      - |-
        **Enabled the team to deliver updates to the hybrid app's web code and assets without waiting for a new app store review** by integrating Microsoft CodePush.
        For releases that required store review, implemented the build and submission workflows for both Android and iOS using fastlane.
    skills: [ts-js, Angular, Ionic, REST, MongoDB, fastlane, Apple Store, Google Play, Auth0, Jenkins, GitLab CI, Protractor.js, Mocha]

  - name: Global Logic (outsource)
    location: Kyiv, Ukraine
    position: Team lead / Product owner
    startDate: "2014-10"
    endDate: "2016-01"
    description: |-
      A web management system for embedded systems, including video servers.
    summary: |
      Led a three-person engineering team building a web application for managing embedded devices, including video servers.
      Managed hiring, mentoring, one-on-ones, performance reviews, and application architecture.
      Six months into the role, I **was promoted** to proxy product owner while continuing to lead the team.
      **Worked with the product manager**, who gathered client needs and set roadmap priorities, to break planned work into epics and tasks.
      Wrote BDD scenarios in Jira that developers refined during planning and used to guide implementation and end-to-end testing.
    highlights:
      - |-
        **Simplified permission management across a form-heavy application** by building a reusable form field that rendered an editable input for administrators and a formatted, read-only value for regular users.
        Taught the team to apply SOLID principles during the refactor.
        Together, we replaced repeated input and binding code with shared fields that behaved consistently across forms.
      - |-
        **Helped developers move faster during implementation** by breaking stakeholder requests into epics and tasks and writing BDD scenarios for each task in Jira.
        Developers used planning sessions to clarify expected behavior, then used the same scenarios to write end-to-end tests.
      - |-
        **Equipped developers to take ownership of end-to-end testing ahead of the planned withdrawal of dedicated QA support.**
        Built an internal Protractor library that modeled pages as reusable sections, forms, and controls.
        The team used it to build a suite of 400+ end-to-end tests, including one that changed a video server's configuration and verified it after a 15-minute restart.
      - |-
        **Trained the customer's QA team in Israel on end-to-end testing** at the customer's request.
        Delivered a multi-day, on-site workshop on the approach I had developed for the project.
    skills: [ts-js, Angular, Redis, REST, Protractor.js, Mocha]

  - name: Daxx BV (outstaff)
    location: Kyiv, Ukraine
    position: Senior front-end developer / architect
    startDate: "2013-08"
    endDate: "2014-10"
    description: |-
      A SaaS management platform for IP telephony over cloud.
    summary: |
      Owned frontend architecture and development for a white-label cloud telephony platform with separate applications for company administrators, providers, and users.
