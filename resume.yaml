projects:
  - name: CASL and UCAST
    url: https://casl.js.org
    startDate: "2017"
    roles: [Author]
    type: open source
    custom:
      label: Authorization tooling
    highlights:
      - Created and for nearly a decade have maintained [CASL](https://casl.js.org/), an open-source authorization library covering
        the entire JavaScript/TypeScript stack, with 11M+ monthly npm downloads.
      - Designed [UCAST](https://github.com/stalniy/ucast) to represent and evaluate authorization rules and translate conditions into SQL queries.
        Its format was adopted by [Open Policy Agent](https://www.openpolicyagent.org/docs/filtering/ucast-syntax) and [Cerbos](https://www.cerbos.dev/ecosystem/ucast) for data filtering.
      - Presented at JSFest conference on using CASL to implement authorization across the TypeScript stack, showing how developers could define authorization rules in one place and apply them across the application.
    keywords: [TypeScript, Authorization]

  - name: AI skills
    startDate: "2026"
    type: open source
    roles: [Author]
    custom:
      label: Spec-Driven Development
    highlights:
      - Created [Agentic Software Engineering skills](https://github.com/stalniy/skills) for reviewing software specifications, identifying architectural risks, and
        resolving ambiguous requirements before implementation.
      - Developed behavioral evaluations for AI agents and techniques for reducing unnecessary complexity
        while preserving architectural decisions.

  - name: Real-time Video Player for Dahua
    startDate: "2025"
    type: open source
    roles: [Author]
    highlights:
      - |-
       **Created a real-time video player for Dahua cameras** that allowed me to view live video from Dahua cameras in Home Assistant without the noticeable delay.
       Built on a third-party player for Dahua cameras and packaged it for personal use as an installable Home Assistant integration.
       For the initial version, I compiled a custom WebAssembly build of FFmpeg to convert video into a browser-supported format.
       But later, I rewrote playback to decode Dahua's RTSP-over-WebSocket stream in the browser using WebCodecs.

  - name: Babysitter
    startDate: "2020"
    roles: [Author]
    type: chatbot
    custom:
      label: Telegram bot
    highlights:
      - |-
        **Gave my family a shared sleep log at no cost** by building a Telegram bot on the AWS Free Tier.
        My wife, my daughter's grandmother, and I could each record when my daughter woke up or fell asleep with one tap.
        We used daily and monthly summaries alongside reference sleep patterns to decide when to put her to bed and how long to let her sleep.

  - name: "0 Step checkout"
    roles: [Author]
    startDate: "2012"
    type: Magento plugin
    summary: 0 Step Checkout provide One Page Checkout functionality for Magento, combine all the steps for checkout (including shopping cart) into one page only.
    highlights:
      - |-
        **Let shoppers review their cart and complete checkout on a single page** by building an independent Magento plugin that combined the cart and checkout steps, removing the need to click through successive screens.

